name: Update literature website

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many recent days to search"
        required: false
        default: "7"
      clear_cache:
        description: "Rebuild the paper list without the previous cache"
        type: boolean
        required: false
        default: false
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    if: github.event_name != 'issues' || github.event.issue.title == 'Research Interests'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore paper cache
        uses: actions/cache/restore@v4
        with:
          path: .paper-cache
          key: selenium-papers-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            selenium-papers-

      - name: Hydrate paper data
        shell: bash
        run: |
          mkdir -p web/data
          if [ -f .paper-cache/papers.json ]; then
            cp .paper-cache/papers.json web/data/papers.json
          fi

      - name: Collect papers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_ISSUE_TITLE: Research Interests
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || vars.LOOKBACK_DAYS || '1' }}
          MAX_PER_TOPIC: ${{ vars.MAX_PER_TOPIC || '10' }}
          MAX_SUMMARIES: ${{ vars.MAX_SUMMARIES || '12' }}
          MAX_NEW_PAPERS: ${{ vars.MAX_NEW_PAPERS || '50' }}
          MAX_STORED_PAPERS: ${{ vars.MAX_STORED_PAPERS || '50' }}
          RECENT_HISTORY_DAYS: ${{ vars.RECENT_HISTORY_DAYS || '45' }}
          MIN_DAILY_PAPERS: ${{ vars.MIN_DAILY_PAPERS || '8' }}
          DAILY_BACKFILL_DAYS: ${{ vars.DAILY_BACKFILL_DAYS || '14' }}
          MIN_MATCH_SCORE: ${{ vars.MIN_MATCH_SCORE || '0.12' }}
          PAPER_SOURCES: ${{ vars.PAPER_SOURCES || '' }}
          SOURCE_DELAY_SECONDS: ${{ vars.SOURCE_DELAY_SECONDS || '1' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || '' }}
          CROSSREF_EMAIL: ${{ vars.CROSSREF_EMAIL || '' }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL || '' }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL || vars.CONTACT_EMAIL || '' }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          CLEAR_PAPER_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_cache || 'false' }}
          LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY || '1' }}
          LLM_REQUEST_DELAY_SECONDS: ${{ vars.LLM_REQUEST_DELAY_SECONDS || '6' }}
          LLM_RETRIES: ${{ vars.LLM_RETRIES || '2' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'gemini-2.5-flash-lite' }}
        run: python scripts/collect_papers.py

      - name: Save paper cache
        shell: bash
        run: |
          mkdir -p .paper-cache
          cp web/data/papers.json .paper-cache/papers.json

      - name: Persist paper cache
        uses: actions/cache/save@v4
        with:
          path: .paper-cache
          key: selenium-papers-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
