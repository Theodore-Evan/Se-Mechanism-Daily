name: 更新 Se 文献网站
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_cache && '清空后重抓文献' || '刷新文献并发布' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "向前检索多少天（刷新时推荐 7）"
        required: false
        default: "7"
      clear_cache:
        description: "清空已有文献缓存后重新抓取"
        type: boolean
        required: false
        default: false
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    if: >-
      (github.event_name != 'issues' || (github.event.issue.title == 'Research Interests' && github.event.issue.user.login == github.repository_owner)) &&
      (github.event_name != 'schedule' || github.event.schedule != '*/30 * * * *' || vars.MULTI_USER_MODE == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore paper cache
        if: vars.MULTI_USER_MODE != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .paper-cache
          key: selenium-papers-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            selenium-papers-

      - name: Hydrate paper data
        if: vars.MULTI_USER_MODE != 'true'
        shell: bash
        run: |
          mkdir -p web/data
          if [ -f .paper-cache/papers.json ]; then
            cp .paper-cache/papers.json web/data/papers.json
          fi

      - name: Collect papers
        env:
          MULTI_USER_MODE: ${{ vars.MULTI_USER_MODE || 'false' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_SECRET_MASTER_KEY: ${{ secrets.USER_SECRET_MASTER_KEY }}
          COLLECT_PENDING_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_ISSUE_TITLE: Research Interests
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || vars.LOOKBACK_DAYS || '1' }}
          MAX_PER_TOPIC: ${{ vars.MAX_PER_TOPIC || '10' }}
          MAX_SUMMARIES: ${{ vars.MAX_SUMMARIES || '12' }}
          MAX_NEW_PAPERS: ${{ vars.MAX_NEW_PAPERS || '50' }}
          MAX_STORED_PAPERS: ${{ vars.MAX_STORED_PAPERS || '500' }}
          RECENT_HISTORY_DAYS: ${{ vars.RECENT_HISTORY_DAYS || '45' }}
          MIN_DAILY_PAPERS: ${{ vars.MIN_DAILY_PAPERS || '8' }}
          DAILY_BACKFILL_DAYS: ${{ vars.DAILY_BACKFILL_DAYS || '14' }}
          MIN_MATCH_SCORE: ${{ vars.MIN_MATCH_SCORE || '0.12' }}
          PAPER_SOURCES: ${{ vars.PAPER_SOURCES || '' }}
          SOURCE_DELAY_SECONDS: ${{ vars.SOURCE_DELAY_SECONDS || '1' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || '' }}
          CROSSREF_EMAIL: ${{ vars.CROSSREF_EMAIL || '' }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL || '' }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL || vars.CONTACT_EMAIL || '' }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          CLEAR_PAPER_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_cache || 'false' }}
          LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY || '1' }}
          LLM_REQUEST_DELAY_SECONDS: ${{ vars.LLM_REQUEST_DELAY_SECONDS || '6' }}
          LLM_RETRIES: ${{ vars.LLM_RETRIES || '2' }}
          LLM_PROVIDER_ID: zhipu
          LLM_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.ZHIPU_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          LLM_MODEL: ${{ vars.ZHIPU_MODEL || 'glm-4-flash-250414' }}
          LLM_PROVIDER_NAME: 智谱 GLM
        shell: bash
        run: |
          if [ "$MULTI_USER_MODE" = "true" ]; then
            python scripts/collect_users.py
          else
            python scripts/collect_papers.py
          fi

      - name: Save paper cache
        if: vars.MULTI_USER_MODE != 'true'
        shell: bash
        run: |
          mkdir -p .paper-cache
          cp web/data/papers.json .paper-cache/papers.json

      - name: Persist paper cache
        if: vars.MULTI_USER_MODE != 'true'
        uses: actions/cache/save@v4
        with:
          path: .paper-cache
          key: selenium-papers-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure browser backend
        env:
          MULTI_USER_MODE: ${{ vars.MULTI_USER_MODE || 'false' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/write_web_config.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
